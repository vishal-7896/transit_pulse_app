<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://browser.sentry-cdn.com/8.38.0/bundle.min.js" crossorigin="anonymous"></script>
  <script>
    if (window.Sentry) {
      Sentry.init({
        dsn: "https://5900da1832d4c247e5f044781ce4d36b@o4512355430432768.ingest.us.sentry.io/4512355513794560",
        tracesSampleRate: 0.1
      });
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e141b">
  <title>TransitPulse — Starred</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e141b">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker registered:', reg.scope))
        .catch((err) => console.log('Service Worker registration failed:', err));
    });
  }
</script>
</head>
<body class="page page-starred">
  <main class="mobile-shell">
    <header class="top-bar">
      <div class="brand-mini">TransitPulse</div>
    </header>

    <section class="welcome-block">
      <h1>Starred stops</h1>
      <p>The stops you check every day, one tap away.</p>
    </section>

    <section id="starred-list" class="starred-list" style="margin-top:26px" aria-live="polite"></section>

    <div id="starred-empty" class="state-card is-hidden">
      <div class="state-icon" aria-hidden="true">☆</div>
      <div>
        <strong>No starred stops yet</strong>
        <p>Open a route, then tap the star on a stop to save it here.</p>
      </div>
    </div>
    <a class="wide-button wide-button-secondary link-button" href="routes.html">Browse routes</a>
  </main>

  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="favorites.js"></script>
  <script src="starred-ui.js"></script>
  <script src="nav.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!TransitPulseStorage.getUserId()) { window.location.href = "register.html"; return; }
      var list = document.getElementById("starred-list");
      var empty = document.getElementById("starred-empty");
      function refresh() {
        var n = TransitPulseStarredUI.render(list);
        empty.classList.toggle("is-hidden", n > 0);
      }
      list.addEventListener("click", function () { window.setTimeout(refresh, 0); });
      refresh();
    });
  </script>
</body>
</html>

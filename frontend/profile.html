<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e141b">
  <title>TransitPulse — Profile</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <!-- Firebase Web SDK (needed so API calls carry the login token) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</head>
<body class="page page-profile">
  <main class="mobile-shell">
    <header class="top-bar">
      <div class="brand-mini">TransitPulse</div>
      <button class="ghost-button" id="signout-btn" type="button">Sign out</button>
    </header>

    <div id="profile-loading" class="state-card">
      <div class="loading-dot" aria-hidden="true"></div>
      <div>
        <strong>Loading your profile</strong>
        <p>Counting your sightings and badges.</p>
      </div>
    </div>

    <div id="profile-error" class="message-box message-error is-hidden" role="alert"></div>
    <button id="retry-profile-btn" class="wide-button wide-button-secondary is-hidden" type="button">Try again</button>

    <div id="profile-content" class="is-hidden">
      <section class="pass" aria-label="Your commuter pass">
        <div class="pass-slot" aria-hidden="true"></div>
        <div class="pass-id">
          <div class="pass-photo" id="profile-avatar" aria-hidden="true">C</div>
          <div class="pass-who">
            <div class="profile-name-row" id="profile-name-row">
              <h1 id="profile-name">Commuter</h1>
              <button class="profile-edit-btn" id="edit-name-btn" type="button" aria-label="Edit name">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
              </button>
            </div>
            <form class="profile-name-form is-hidden" id="name-form">
              <input id="name-input" type="text" maxlength="40" autocomplete="nickname" aria-label="Your name">
              <button class="profile-save-btn" type="submit">Save</button>
              <button class="profile-cancel-btn" type="button" id="cancel-name-btn" aria-label="Cancel">✕</button>
            </form>
            <span class="rank-stamp" id="profile-level"></span>
            <p class="profile-meta" id="profile-since"></p>
          </div>
        </div>

        <div class="pass-perf" aria-hidden="true"></div>

        <div class="hero-stats" aria-label="Your stats">
          <div><strong id="stat-total">0</strong><span>Sightings</span></div>
          <div><strong id="stat-streak">0</strong><span>Day streak</span></div>
          <div><strong id="stat-badges">0</strong><span>Badges</span></div>
        </div>

        <div class="hero-last" id="hero-last"></div>
      </section>

      <section id="next-badge" class="profile-section is-hidden" aria-label="Next badge"></section>

      <section class="profile-section" aria-label="Badges">
        <div class="route-heading-row">
          <h2>Badges</h2>
          <p class="section-subtitle" id="badge-count"></p>
        </div>
        <div id="badge-grid" class="badge-grid"></div>
      </section>

      <section class="profile-section" aria-label="Your sightings">
        <div class="route-heading-row">
          <h2>Your sightings</h2>
        </div>
        <div id="recent-list" class="recent-list"></div>
        <button id="recent-toggle" class="recent-toggle is-hidden" type="button" aria-expanded="false"></button>
        <div id="recent-empty" class="state-card is-hidden">
          <div class="state-icon" aria-hidden="true">○</div>
          <div>
            <strong>No sightings yet</strong>
            <p>Open a stop and tap “I see the bus” to earn your first badge.</p>
          </div>
        </div>
        <a class="wide-button wide-button-primary link-button" href="routes.html">Share a sighting</a>
      </section>
    </div>
  </main>

  <div id="badge-sheet" class="badge-sheet is-hidden" role="dialog" aria-modal="true" aria-labelledby="badge-sheet-title">
    <div class="badge-sheet-card" id="badge-sheet-card"></div>
  </div>

  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="api.js"></script>
  <script src="badge-art.js"></script>
  <script src="profile.js"></script>
  <script src="nav.js"></script>
</body>
</html>

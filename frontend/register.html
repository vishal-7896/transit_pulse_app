<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10152f">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>TransitPulse — Sign Up</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Web SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <!-- PWA Manifest & Meta Tags -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10152f">

<!-- Register Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker registered:', reg.scope))
        .catch((err) => console.log('Service Worker registration failed:', err));
    });
  }
</script>
</head>
<body class="page page-form">
  <main class="mobile-shell">
    <a class="back-link" href="index.html">← Back</a>

    <section class="form-hero">
      <div class="mini-icon mini-icon-bus" aria-hidden="true">🚌</div>
      <p class="eyebrow">GET STARTED</p>
      <h1>Create your TransitPulse profile</h1>
      <p>Verify your phone number with an OTP to report live sightings.</p>
    </section>

    <section class="surface-card">
      <form id="register-form" novalidate>
        <div class="form-group" id="name-group">
          <label for="name-input">Your name <span class="muted-label"></span></label>
          <input
            type="text"
            id="name-input"
            name="name"
            autocomplete="name"
            placeholder="e.g. Rohan"
            maxlength="80"
          >
        </div>

        <div class="form-group" id="phone-group">
          <label for="phone-input">Phone number</label>
          <input
            type="tel"
            id="phone-input"
            name="phone"
            autocomplete="tel"
            inputmode="numeric"
            maxlength="10"
            pattern="[0-9]{10}"
            placeholder="10-digit mobile number"
            required
          >
          <p class="field-hint">Enter 10 digits </p>
        </div>

        <!-- OTP STEP (Hidden initially) -->
        <div class="form-group is-hidden" id="otp-group">
          <label for="otp-input">Enter 6-digit OTP</label>
          <input
            type="text"
            id="otp-input"
            inputmode="numeric"
            maxlength="6"
            placeholder="e.g. 123456"
          >
          <p class="field-hint">Enter the 6-digit code sent to your phone.</p>
        </div>

        <!-- Invisible reCAPTCHA container required by Firebase -->
        <div id="recaptcha-container"></div>

        <button type="submit" class="wide-button wide-button-primary" id="register-btn">
          <span class="button-label">Send OTP</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>

        <div class="message-box is-hidden" id="register-message" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="returning-card" id="returning-card">
      <div>
        <p class="returning-title">Already registered on this browser?</p>
        <p class="returning-copy">You can continue without registering again.</p>
      </div>
      <a class="text-button" href="routes.html">Continue →</a>
    </section>
  </main>

  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="api.js"></script>
  <script src="register.js"></script>
</body>
</html>
